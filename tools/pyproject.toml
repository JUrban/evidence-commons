[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-commons"
version = "0.1.0"
description = "Reference implementations of the Evidence Commons instruments: validation, markets, ledgers, recorder, replay, reliance, reports"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["pyyaml>=6", "jsonschema>=4", "numpy>=1.24", "scipy>=1.10", "cryptography>=41"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
ec = "ec.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ec*"]
