- endpoint as registered before unblinding
- no post-hoc subgroup
- sponsor not trading (constitutional)
adjudicator: <named at registration>
ethics: ethics approval required; sponsor barred from trading
screening:
  service: <named at registration>
  status: pending
cost_estimate: 100000
currency: EUR
expiry: '<P+1460D: P = protocol registration date>'
