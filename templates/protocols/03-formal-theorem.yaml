validity_checks:
- trust base declared and matches the check log
- fidelity reader has no role in the proof
adjudicator: <named at registration>
ethics: not required
screening:
  service: <named at registration>
  status: pending
cost_estimate: 300
currency: EUR
expiry: '<P+30D: P = protocol registration date>'
