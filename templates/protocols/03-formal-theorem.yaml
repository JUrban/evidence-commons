id: template:03-formal-theorem@1
template: 03-formal-theorem@1
claim_type: formal
test: Proof check in the named proof assistant with declared trust base (kernel, axioms,
  unverified components), plus an independent fidelity check that the formal statement
  matches the registered informal statement
performer_class: named checker; independent reader for fidelity
success_criterion: Check passes and fidelity confirmed
outcome_map:
  confirmed: bond returns
  qualified: 'check passes, fidelity disputed: unpriceable pending restatement'
